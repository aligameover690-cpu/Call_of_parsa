<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1024">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call Of Parsa">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="yes">
<title>Call Of Parsa</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0d1024;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:Tahoma,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;color:#fff}
button{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0;--u:1px;--c:1;direction:ltr}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.t{unicode-bidi:plaintext}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd24a 45%,#c98a1a);border:2px solid #9a6410;vertical-align:-.15em}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(12*var(--u)) calc(20*var(--u) + env(safe-area-inset-right,0px)) 0 calc(20*var(--u) + env(safe-area-inset-left,0px));pointer-events:none}
.hpBox{display:flex;flex-direction:column;gap:calc(6*var(--u));width:calc(300*var(--u))}
.hp{display:flex;align-items:center;gap:calc(10*var(--u))}
.lbl{font-size:max(11px,calc(16*var(--u)));font-weight:700;color:#ffd7a8;min-width:2.4em}
.bar{flex:1;height:calc(18*var(--u));border:calc(3*var(--u)) solid rgba(255,255,255,.7);border-radius:calc(12*var(--u));background:rgba(8,5,20,.6);overflow:hidden}
.bar.sh{height:calc(11*var(--u))}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fbf6a,#9be86a);transition:width .12s}
.bar.sh i{background:linear-gradient(90deg,#3aa8ff,#8fe0ff)}
#reFill{background:linear-gradient(90deg,#ff9a3c,#ffd24a)!important}
.bar i.low{background:linear-gradient(90deg,#e0303f,#ff8a4a)}
.row2{display:flex;align-items:center;gap:calc(6*var(--u));flex-wrap:wrap}
.wpn{pointer-events:auto;font:700 max(11px,calc(14*var(--u))) Tahoma,"Noto Sans Arabic",sans-serif;background:rgba(8,5,20,.6);border:2px solid rgba(255,255,255,.5);border-radius:10px;padding:2px 10px;cursor:pointer}
#ammoTxt{font:700 max(10px,calc(13*var(--u))) Tahoma,sans-serif;color:#dcd0ea}
#ammoTxt.reloading{color:#ffb36b}
#power{font-size:max(11px,calc(13*var(--u)));font-weight:700;color:#2b1650;background:#ffd24a;border-radius:10px;padding:2px 10px}
.mid{text-align:center;text-shadow:0 calc(2*var(--u)) 0 rgba(8,4,20,.8)}
#waveTxt{font-size:max(12px,calc(19*var(--u)));font-weight:700;color:#ffd7a8}
#scoreTxt{font:900 max(18px,calc(38*var(--u))) Impact,"Arial Black",Tahoma,sans-serif;line-height:1.05}
.coinRow{font:800 max(13px,calc(20*var(--u))) Tahoma,sans-serif;color:#ffe08a;margin-top:2px}
.tools{display:flex;gap:calc(10*var(--u));pointer-events:auto}
.tool{width:calc(50*var(--u));height:calc(50*var(--u));min-width:34px;min-height:34px;border-radius:50%;border:calc(3*var(--u)) solid rgba(255,255,255,.55);background:rgba(8,5,20,.55);display:grid;place-items:center;padding:0;cursor:pointer;font:800 max(13px,calc(18*var(--u))) Tahoma,sans-serif}
.tool svg{width:56%;height:56%}
.tool.off .wv{display:none}
.tool.cd{opacity:.4}
#abIcon{color:#ffd24a}

/* Banner */
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;
  font:900 max(22px,calc(52*var(--u))) Impact,"Arial Black",Tahoma,sans-serif;color:#fff;
  text-shadow:calc(3*var(--u)) calc(3*var(--u)) 0 #d8402a,calc(6*var(--u)) calc(6*var(--u)) 0 #1a1226}
#banner.show{animation:bn 2s ease-out both}
@keyframes bn{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(calc(-16*var(--u)))}}

/* Touch controls */
#controls{position:absolute;inset:0;pointer-events:none;display:none;touch-action:none}
body.touch #controls{display:block}
.btn{position:absolute;display:grid;place-items:center;border-radius:50%;pointer-events:auto;touch-action:none;
  background:rgba(255,255,255,.12);border:calc(3*var(--u)) solid rgba(255,255,255,.4)}
.btn svg{width:46%;height:46%}
.btn.down{background:rgba(255,120,60,.6);border-color:#ffd3b0;transform:scale(.94)}
#bL{width:calc(116*var(--u)*var(--c));height:calc(116*var(--u)*var(--c));left:calc(24*var(--u) + env(safe-area-inset-left,0px));bottom:calc(28*var(--u))}
#bR{width:calc(116*var(--u)*var(--c));height:calc(116*var(--u)*var(--c));left:calc(24*var(--u) + 130*var(--u)*var(--c) + env(safe-area-inset-left,0px));bottom:calc(28*var(--u))}
#bF{width:calc(140*var(--u)*var(--c));height:calc(140*var(--u)*var(--c));right:calc(26*var(--u) + env(safe-area-inset-right,0px));bottom:calc(26*var(--u))}
#bJ{width:calc(112*var(--u)*var(--c));height:calc(112*var(--u)*var(--c));right:calc(40*var(--u) + 140*var(--u)*var(--c) + env(safe-area-inset-right,0px));bottom:calc(22*var(--u))}
#bF svg{width:54%;height:54%}

/* Screens */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
  background:radial-gradient(ellipse at 50% 55%,rgba(24,12,40,.55),rgba(6,4,16,.92))}
.card{text-align:center;padding:0 calc(24*var(--u))}
.l1{display:block;font:800 max(14px,calc(28*var(--u))) Impact,"Arial Black",sans-serif;letter-spacing:.55em;margin-right:-.55em;color:#ffb98a}
.l2{display:block;font:900 max(52px,calc(124*var(--u))) Impact,"Arial Black",sans-serif;line-height:.98;color:#fff;transform:skewX(-8deg);
  text-shadow:.03em .03em 0 #d8402a,.06em .06em 0 #1a1226}
#mMsg{margin:calc(12*var(--u)) 0 0;font-size:max(18px,calc(34*var(--u)));font-weight:800}
#mStats{margin:calc(8*var(--u)) 0 0;font-size:max(13px,calc(21*var(--u)));line-height:1.75;color:#ffe9d0}
.btnrow{display:flex;gap:calc(14*var(--u));justify-content:center;margin-top:calc(14*var(--u));flex-wrap:wrap}
button.pri{font:800 max(16px,calc(30*var(--u))) Tahoma,"Noto Sans Arabic",sans-serif;
  padding:calc(11*var(--u)) calc(58*var(--u));border:0;border-radius:calc(14*var(--u));background:#ff7a3c;color:#1a1226;
  box-shadow:0 calc(6*var(--u)) 0 #a83a1c;cursor:pointer}
button.pri:active{transform:translateY(calc(4*var(--u)));box-shadow:0 calc(2*var(--u)) 0 #a83a1c}
button.sec{font:700 max(14px,calc(22*var(--u))) Tahoma,"Noto Sans Arabic",sans-serif;padding:calc(8*var(--u)) calc(26*var(--u));
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);border-radius:calc(12*var(--u));cursor:pointer}
button.sec:active{background:rgba(255,255,255,.28)}
.tip{margin:calc(16*var(--u)) auto 0;max-width:calc(700*var(--u));font-size:max(12px,calc(17*var(--u)));line-height:1.75;color:#e4d6f0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* Shop + settings */
.panel{width:min(96vw,1080px);max-height:96%;display:flex;flex-direction:column;gap:calc(10*var(--u));padding:calc(12*var(--u)) calc(20*var(--u))}
.ph1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph1 h2{margin:0;font-size:max(18px,calc(34*var(--u)));font-weight:800}
.coinBadge{display:flex;align-items:center;gap:8px;font:900 max(16px,calc(26*var(--u))) Impact,"Arial Black",sans-serif;background:rgba(8,5,20,.65);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 14px;min-width:80px;justify-content:center}
.tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:700 max(12px,calc(17*var(--u))) Tahoma,"Noto Sans Arabic",sans-serif;padding:6px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.35);background:transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#ff7a3c;color:#1a1226;border-color:#ff7a3c}
.cards{display:flex;gap:calc(14*var(--u));overflow-x:auto;overflow-y:hidden;padding:6px 2px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.card2{flex:0 0 max(155px,calc(220*var(--u)));display:flex;flex-direction:column;gap:calc(6*var(--u));text-align:center;
  background:rgba(22,12,44,.88);border:2px solid rgba(255,255,255,.2);border-radius:calc(16*var(--u));padding:calc(12*var(--u))}
.card2.eq{border-color:#ff7a3c}
.card2 h3{margin:0;font-size:max(14px,calc(22*var(--u)))}
.card2 .d{margin:0;font-size:max(11px,calc(14*var(--u)));color:#d8c8e8;min-height:2.6em;line-height:1.4}
.st{display:flex;justify-content:space-between;align-items:center;font-size:max(11px,calc(14*var(--u)))}
.pips i{display:inline-block;width:8px;height:8px;margin-left:3px;border-radius:50%;background:rgba(255,255,255,.2)}
.pips i.on{background:#ffb36b}
.buy{margin-top:auto;font:800 max(13px,calc(19*var(--u))) Tahoma,"Noto Sans Arabic",sans-serif;padding:7px;border:0;border-radius:12px;background:#ff7a3c;color:#1a1226;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.buy[disabled]{background:rgba(255,255,255,.14);color:#fff;cursor:default}
.buy.no{background:#5a4a72;color:#fff}
.mapThumb{width:100%;height:auto;aspect-ratio:220/90;border-radius:10px;display:block;background:#000;border:1px solid rgba(255,255,255,.2)}
#shopMsg{min-height:1.6em;text-align:center;font-size:max(12px,calc(17*var(--u)));color:#ffb98a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(10*var(--u)) calc(18*var(--u))}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:max(44px,calc(60*var(--u)));padding:6px 14px;font-size:max(13px,calc(20*var(--u)));
  background:rgba(22,12,44,.8);border:2px solid rgba(255,255,255,.18);border-radius:14px}
.sw{width:52px;height:28px;flex:0 0 auto;border-radius:999px;border:0;background:rgba(255,255,255,.22);position:relative;cursor:pointer;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .12s}
.sw.on{background:#3fbf6a}
.sw.on::after{left:27px}
.seg{display:flex;border:2px solid rgba(255,255,255,.3);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font:inherit;font-size:max(12px,calc(17*var(--u)));cursor:pointer}
.seg button.on{background:#ff7a3c;color:#1a1226}
.dng{border:2px solid #e0303f;background:transparent;border-radius:12px;padding:5px 12px;font:inherit;font-size:max(12px,calc(17*var(--u)));cursor:pointer}

/* Rotate notice */
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#0d1024;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;font-size:20px;padding:24px;line-height:1.7}
@media (orientation:portrait){body.touch #rotate{display:flex}}
.ph{width:54px;height:92px;border:4px solid #ff7a3c;border-radius:12px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" height="540"></canvas>

  <div id="hud">
    <div class="hpBox">
      <div class="hp"><span class="lbl t">جان</span><div class="bar"><i id="hpFill"></i></div></div>
      <div class="hp" id="shRow" hidden><span class="lbl t">سپر</span><div class="bar sh"><i id="shFill"></i></div></div>
      <div class="hp" id="reRow" hidden><span class="lbl t">ریلود</span><div class="bar sh"><i id="reFill"></i></div></div>
      <div class="row2">
        <button class="wpn t" id="wpnBtn"></button>
        <span id="ammoTxt" class="t"></span>
        <div id="power" class="t" hidden></div>
      </div>
    </div>
    <div class="mid">
      <div id="waveTxt" class="t"></div>
      <div id="scoreTxt" class="t">۰</div>
      <div class="coinRow"><span class="coin"></span> <span id="coinTxt">۰</span></div>
    </div>
    <div class="tools">
      <button class="tool" id="abBtn" hidden aria-label="قابلیت ویژه"><span id="abIcon">★</span></button>
      <button class="tool" id="btnMute" aria-label="صدا"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path class="wv" d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
      <button class="tool" id="btnPause" aria-label="مکث"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#fff"/></svg></button>
    </div>
  </div>

  <div id="banner" class="t"></div>

  <div id="controls">
    <div class="btn" id="bL" data-k="left"><svg viewBox="0 0 24 24"><path d="M15 4L6 12l9 8z" fill="#fff"/></svg></div>
    <div class="btn" id="bR" data-k="right"><svg viewBox="0 0 24 24"><path d="M9 4l9 8-9 8z" fill="#fff"/></svg></div>
    <div class="btn" id="bJ" data-k="jump"><svg viewBox="0 0 24 24"><path d="M12 4l8 10H4z" fill="#fff"/><rect x="9" y="15" width="6" height="5" rx="1" fill="#fff"/></svg></div>
    <div class="btn" id="bF" data-k="fire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="2.2" fill="#fff"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  </div>

  <!-- Main / pause / game-over / revive menu -->
  <div id="menu" class="screen">
    <div class="card">
      <span class="l1">CALL OF</span>
      <span class="l2">PARSA</span>
      <p id="mMsg" class="t" hidden></p>
      <p id="mStats" class="t" hidden></p>
      <div class="btnrow"><button id="mBtn" class="pri">شروع بازی</button></div>
      <div class="btnrow">
        <button id="mShop" class="sec">فروشگاه</button>
        <button id="mSet" class="sec">تنظیمات</button>
        <button id="mHome" class="sec">منوی اصلی</button>
        <button id="mSkip" class="sec" hidden>رد شدن</button>
      </div>
      <p id="mTip" class="tip t"></p>
    </div>
  </div>

  <!-- Shop -->
  <div id="shop" class="screen" hidden>
    <div class="panel">
      <div class="ph1">
        <button class="sec" id="shopBack">بازگشت</button>
        <h2 class="t">فروشگاه</h2>
        <div class="coinBadge"><span class="coin"></span><span id="shopCoins">۰</span></div>
      </div>
      <div class="tabs">
        <button data-tab="guns" class="on t">تفنگ‌ها</button>
        <button data-tab="up" class="t">تقویت سلاح</button>
        <button data-tab="def" class="t">دفاع</button>
        <button data-tab="tool" class="t">ابزار</button>
        <button data-tab="skins" class="t">اسکین‌ها</button>
        <button data-tab="maps" class="t">نقشه‌ها</button>
      </div>
      <div id="shopList" class="cards"></div>
      <div id="shopMsg" class="t"></div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="screen" hidden>
    <div class="panel">
      <div class="ph1">
        <button class="sec" id="setBack">بازگشت</button>
        <h2 class="t">تنظیمات</h2>
        <span style="min-width:80px"></span>
      </div>
      <div class="grid">
        <div class="row"><span class="t">صدا</span><button class="sw" data-set="sound" aria-label="صدا"></button></div>
        <div class="row"><span class="t">لرزش صفحه</span><button class="sw" data-set="shake" aria-label="لرزش صفحه"></button></div>
        <div class="row"><span class="t">ویبره</span><button class="sw" data-set="vib" aria-label="ویبره"></button></div>
        <div class="row"><span class="t">کمک هدف‌گیری</span><button class="sw" data-set="assist" aria-label="کمک هدف‌گیری"></button></div>
        <div class="row"><span class="t">اندازهٔ دکمه‌ها</span>
          <div class="seg"><button data-size="0.85" class="t">کوچک</button><button data-size="1" class="t">متوسط</button><button data-size="1.2" class="t">بزرگ</button></div></div>
        <div class="row"><span class="t">پاک کردن پیشرفت</span><button class="dng t" id="resetBtn">پاک کن</button></div>
      </div>
    </div>
  </div>
</div>

<div id="rotate" dir="rtl"><div class="ph"></div><div>گوشی را افقی کن تا بازی شروع بشه</div></div>

let actx = null, noiseBuf = null;
function audioInit() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f0, f1, dur, type, vol) {
  if (!actx || !SAVE.set.sound) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol) {
  if (!actx || !SAVE.set.sound) return;
  try {
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = actx.createBufferSource(), g = actx.createGain(), t = actx.currentTime;
    s.buffer = noiseBuf;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(g); g.connect(actx.destination);
    s.start(t); s.stop(t + dur);
  } catch (e) {}
}

  if (!spawnQ.length && !enemies.length) {

function drawHuman(e, pal, o) {

function drawPickup(p) {

}
function drawSolid(s) {
  if (s.x + s.w < camX - 10 || s.x > camX + W + 10) return;

  if (s.t === 'crate') {
    ctx.fillStyle = pal.crate[0]; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = pal.crate[1]; ctx.fillRect(s.x + 3, s.y + 3, s.w - 6, s.h - 6);

function drawWorld() {
  const T = MAP.theme;
  for (const r of rubble) {
    if (r.x < camX - 20 || r.x > camX + W + 20) continue;
    ctx.fillStyle = T.rubble[r.ci]; ctx.fillRect(r.x, GROUND - r.s * 0.6, r.s, r.s * 0.6);
  }
  for (const s of SOLID) drawSolid(s);

  for (const p of pickups) drawPickup(p);

    ctx.fillStyle = '#3a4a2e'; ctx.beginPath(); ctx.arc(g.x, g.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a2214'; ctx.fillRect(g.x - 1, g.y - 9, 2, 4);

function render() {

/* ---------- Main loop ---------- */
function updateCamera(dt) {
  const target = clamp(P.x + P.w / 2 - W / 2 + P.face * 70, 0, WORLD - W);
  camX += (target - camX) * Math.min(1, dt * 6);
}
function update(dt) {
  time += dt;
  updatePlayer(dt);
  updateWaves(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateBooms(dt);
  updateGrenades(dt);
  updatePickups(dt);
  updateCoins(dt);
  updateFx(dt);
  updateCamera(dt);
  syncHud();
}
function idle(dt) {
  time += dt;
  if (P) P.anim += dt;

  updateCamera(dt);
}
let last = performance.now(), saveT = 0;
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));

  render();
  requestAnimationFrame(frame);

/* ---------- Boot ---------- */
applySettings();
applyMap();

resize();

camX = clamp(P.x - W / 2, 0, WORLD - W);
requestAnimationFrame(frame);

})();
